<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#522398">
<title>CityServe Warehouse Warm-Up</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23522398'/%3E%3Crect x='14' y='22' width='10' height='28' fill='white'/%3E%3Crect x='27' y='12' width='11' height='38' fill='white'/%3E%3Crect x='41' y='26' width='10' height='24' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --p:#522398; --p2:#6d3fc0; --pl:#efe8f8; --pd:#3b1873;
  --bg:#f7f5fb; --ink:#211a30; --muted:#6b6380; --line:#e2dcec;
  --good:#1b9a52; --bad:#d23f3f; --warn:#d99a00;
  --cb:#c99a5b; --cb2:#a8773d; --cb3:#e6c592;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.screen{display:none;flex:1;flex-direction:column;min-height:0;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));padding-top:max(14px,env(safe-area-inset-top))}
.screen.active{display:flex}

/* ---------- home ---------- */
#home{overflow-y:auto}
.logo{width:72%;max-width:300px;display:block;margin:10px auto 6px}
h1{font-size:28px;margin:6px 0 2px;text-align:center;color:var(--p);letter-spacing:-.5px}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:15px}
.name{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
.name input{display:block;width:100%;margin-top:5px;padding:12px 14px;font-size:16px;border:2px solid var(--line);
  border-radius:12px;background:#fff;outline:none}
.name input:focus{border-color:var(--p2)}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:16px;padding:14px;box-shadow:0 2px 0 var(--line)}
.mode:active{transform:translateY(2px);box-shadow:none}
.mode .mi{font-size:34px;width:48px;text-align:center;flex:none}
.mode b{display:block;font-size:18px;color:var(--p)}
.mode small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.3}
.mode .best{margin-left:auto;flex:none;text-align:right;font-size:11px;color:var(--muted);font-weight:600}
.mode .best span{display:block;font-size:17px;color:var(--ink)}
.linkbtn{background:none;border:none;color:var(--p);font-weight:700;margin:14px auto 0;display:block;font-size:15px;text-decoration:underline}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0}

/* ---------- intro ---------- */
#intro h2{color:var(--p);font-size:26px;margin:18px 0 4px;text-align:center}
#intro .big{font-size:64px;text-align:center;margin-top:10px}
#intro ul{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 16px 16px 36px;line-height:1.45;font-size:16px}
#intro li{margin:4px 0}
.btn{display:block;width:100%;padding:16px;border-radius:14px;border:none;font-size:18px;font-weight:800;
  background:var(--p);color:#fff;box-shadow:0 4px 0 var(--pd);margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pd)}
.btn.ghost{background:#fff;color:var(--p);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.spacer{flex:1}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:10px}
.hud #quit{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px;flex:none}
.hud-mode{font-weight:800;color:var(--p);font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-box{background:#fff;border:2px solid var(--line);border-radius:10px;padding:3px 10px;text-align:center;min-width:64px}
.hud-box small{display:block;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.hud-box b{font-size:19px;font-variant-numeric:tabular-nums}
.hud-box.low b{color:var(--bad)}
.timebar{height:6px;background:var(--line);border-radius:6px;margin:10px 0 8px;overflow:hidden}
.timebar div{height:100%;background:var(--p);width:100%}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.streak{text-align:center;font-weight:800;color:var(--warn);height:20px;font-size:14px}
.pop{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:900;font-size:26px;pointer-events:none;
  animation:pop .8s ease-out forwards;z-index:30;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.toast{position:absolute;left:0;right:0;bottom:6px;margin:0 auto;max-width:94%;background:var(--ink);color:#fff;border-radius:12px;
  padding:10px 14px;font-size:14px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:25}
.toast.show{opacity:.95}
.toast.good{background:var(--good)}
.toast.top{bottom:auto;top:-4px}

/* ---------- scan ---------- */
.q-prompt{font-weight:800;font-size:17px;text-align:center;margin:2px 0 10px}
.pkg{background:linear-gradient(180deg,var(--cb3),var(--cb));border:3px solid var(--cb2);border-radius:14px;padding:14px;
  position:relative;display:flex;gap:12px;align-items:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.pkg::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;transform:translateX(-50%);background:rgba(255,255,255,.18)}
.pkg-icon{font-size:48px;flex:none;position:relative}
.pkg-label{background:#fff;border-radius:8px;padding:10px 12px;flex:1;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.pkg-brand{font-weight:900;font-size:17px;letter-spacing:.3px}
.pkg-brand.none{font-weight:600;font-style:italic;color:var(--muted);font-size:14px}
.pkg-name{font-size:15px;margin-top:2px}
.pkg-size{display:inline-block;margin-top:6px;background:var(--bad);color:#fff;font-weight:800;font-size:13px;padding:2px 8px;border-radius:6px}
.pkg-tag{position:absolute;top:-11px;left:12px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.ai{margin-top:16px;background:#fff;border:2px dashed var(--p2);border-radius:14px;padding:14px;position:relative}
.ai small{position:absolute;top:-11px;left:12px;background:var(--p);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.ai div{font-size:17px;font-weight:600}
.scene{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.scene .em{font-size:44px;letter-spacing:4px}
.scene p{margin:8px 0 0;font-size:16px;font-weight:600}
.opts{display:grid;gap:10px;padding-top:8px}
.fb{margin-top:auto;min-height:44px;display:flex;align-items:flex-end;justify-content:center;text-align:center;font-size:14px;font-weight:600;color:var(--good);padding:6px 4px 0;transition:opacity .3s}
.opts.two{grid-template-columns:1fr 1fr}
.opt{padding:16px 10px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt.yes{background:var(--good);color:#fff;border-color:var(--good);box-shadow:0 4px 0 #13703b;font-size:17px}
.opt.no{background:var(--bad);color:#fff;border-color:var(--bad);box-shadow:0 4px 0 #9a2b2b;font-size:17px}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(25,15,45,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.overlay.show{display:flex}
.card{background:#fff;border-radius:18px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.card h3{margin:0 0 6px;font-size:20px}
.card h3.bad{color:var(--bad)}
.card .rule{display:inline-block;background:var(--pl);color:var(--p);font-weight:800;font-size:12px;padding:3px 8px;border-radius:6px;margin-bottom:8px}
.card p{margin:6px 0;font-size:16px;line-height:1.4}
.card ol{padding-left:22px;line-height:1.4}
.card ol li{margin-bottom:8px}

/* ---------- sort ---------- */
.sort-top{display:flex;flex-direction:column;align-items:center}
.gaylord{width:100%;background:repeating-linear-gradient(90deg,var(--cb) 0 18px,var(--cb2) 18px 20px);border-radius:12px;
  padding:12px;display:flex;justify-content:center;border:3px solid var(--cb2)}
.item{background:#fff;border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.18);
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;min-width:60%}
.item .ie{font-size:40px}
.item .iname{font-size:17px;font-weight:800}
.item.drag{position:fixed;z-index:40;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) rotate(-3deg);min-width:0}
.sort-hint{font-size:12px;color:var(--muted);margin:6px 0 4px}
.bins{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;min-height:0;padding-bottom:4px}
.bin{border:3px solid var(--cb2);border-top-width:8px;border-radius:6px 6px 12px 12px;background:linear-gradient(180deg,var(--cb3),var(--cb));
  display:flex;align-items:center;justify-content:center;padding:4px;min-height:0}
.bin span{background:#fff;border-radius:6px;padding:4px 6px;font-weight:800;font-size:13px;text-align:center;line-height:1.15;color:var(--pd)}
.bin.food span{color:#13703b}
.bin span small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:2px}
.bin.parts{background:linear-gradient(180deg,#cfcfd4,#9fa0a8);border-color:#6f7079}
.bin.good{background:var(--good);border-color:#13703b}
.bin.bad{animation:shake .35s;background:var(--bad);border-color:#9a2b2b}
.bin.hint{background:var(--good);border-color:#13703b;animation:pulse .45s 2}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.07)}}

/* ---------- stack ---------- */
.stack-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.next{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.next canvas{background:#fff;border:2px solid var(--line);border-radius:8px}
#stackMsg{flex:1;text-align:center;font-weight:800;font-size:15px;border-radius:10px;padding:8px;background:#fff;border:2px solid var(--line)}
#stackMsg.ok{color:var(--good);border-color:var(--good)}
#stackMsg.warn{color:#9a6c00;border-color:var(--warn)}
#stackMsg.bad{color:var(--bad);border-color:var(--bad)}
.stackwrap{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center}
#stackC{touch-action:none;display:block}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;gap:8px;margin-top:8px}
.controls button{padding:14px 0;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.controls button:active{transform:translateY(2px);box-shadow:none}
.controls .drop{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 4px 0 var(--pd);font-size:18px}

/* ---------- end ---------- */
#end{overflow-y:auto;text-align:center}
.endcard{background:#fff;border:3px solid var(--p);border-radius:20px;padding:16px;margin-top:6px}
.endcard img{width:60%;max-width:220px}
.endcard .who{font-size:22px;font-weight:900;margin-top:6px}
.endcard .md{color:var(--p);font-weight:800;font-size:15px}
.endcard .score{font-size:64px;font-weight:900;color:var(--p);line-height:1;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:var(--warn);color:#fff;font-weight:900;padding:3px 10px;border-radius:999px;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 4px}
.stats div{background:var(--pl);border-radius:10px;padding:6px}
.stats small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.stats b{font-size:18px}
.stamp{font-size:12px;color:var(--muted);margin-top:8px}
.endnote{font-size:13px;color:var(--muted);margin:8px 0 0}
.recap{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:14px}
.recap h4{margin:0 0 6px;color:var(--p)}
.recap li{margin-bottom:6px}
.endbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>

/* ================= clock ================= */
const clock = {
  left:0, total:1, running:false, last:0,
  start(sec){ this.total = sec*1000; this.left = this.total; this.running = true; this.last = performance.now(); },
  tick(){ if(!this.running) return; const n = performance.now(); this.left -= (n - this.last); this.last = n; },
  pause(){ this.tick(); this.running = false; },
  resume(){ this.last = performance.now(); this.running = true; }
};
document.addEventListener('visibilitychange', () => {
  if(!G || G.over) return;
  if(document.hidden){ if(clock.running){ clock.pause(); G.autoPaused = true; } }
  else if(G.autoPaused && !G.tipOpen){ G.autoPaused = false; clock.resume(); }
});

  if(G.mode === 'stack') stackFrame();
  if(clock.left <= 0 && !G.tipOpen){ endGame('Time!'); return; }

}

/* ================= SCAN CHECK ================= */
function scanInit(){
  G.queue = [];
  scanNext();
}
function scanNext(){
  if(!G.queue.length){
    // alternate-ish: shuffle all, but avoid same question twice in a row across reshuffles
    G.queue = shuffle(SCAN_Q);
    if(G.q && G.queue[G.queue.length-1] === G.q) G.queue.unshift(G.queue.pop());
  }
  const q = G.q = G.queue.pop();
  let h = '<div class="streak"></div>';
  if(q.t === 'check'){
    h += '<div class="q-prompt">Does the AI description match the package?</div>' +
      '<div class="pkg"><span class="pkg-tag">On the package</span><div class="pkg-icon">'+q.icon+'</div><div class="pkg-label">' +
      (q.brand ? '<div class="pkg-brand">'+esc(q.brand)+'</div>' : '<div class="pkg-brand none">No brand printed</div>') +
      '<div class="pkg-name">'+esc(q.name)+'</div>' +
      (q.size ? '<div class="pkg-size">'+esc(q.size)+'</div>' : '') +
      '</div></div>' +
      '<div class="ai"><small>AI description</small><div>"'+esc(q.ai)+'"</div></div>' +
      '<div class="fb"></div><div class="opts two"><button class="opt yes" data-i="0">✓ Looks good</button><button class="opt no" data-i="1">✗ AI got it wrong</button></div>';
  } else {
    h += '<div class="q-prompt">'+esc(q.p)+'</div>' +
      '<div class="scene"><div class="em">'+q.em+'</div><p>'+esc(q.scene)+'</p></div>' +
      '<div class="fb"></div><div class="opts">' + q.o.map((o,i) => '<button class="opt" data-i="'+i+'">'+esc(o)+'</button>').join('') + '</div>';
  }
  $('#stage').innerHTML = h;
  setStreak();
  $('#stage').querySelectorAll('.opt').forEach(b => b.onclick = () => scanAnswer(+b.dataset.i));
}
function scanAnswer(i){
  if(G.over || G.tipOpen) return;
  const q = G.q;
  const correct = q.t === 'check' ? (i === (q.ok ? 0 : 1)) : (i === q.a);
  if(correct){
    G.right++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    scanNext();
    addScore(100 + Math.min(G.streak - 1, 10) * 10);
    toast('✓ ' + q.why, true);
  } else {
    G.wrong++; G.streak = 0; G.missed.push(q);
    clock.left -= 3000;
    buzz(80);
    G.tipOpen = true; clock.pause();
    $('#tipRule').textContent = 'Rule ' + q.rule + ': ' + RULES[q.rule][0];
    $('#tipText').textContent = q.why;
    $('#tip').classList.add('show');
  }
}
$('#tipOk').onclick = () => {
  $('#tip').classList.remove('show');
  if(!G) return;
  G.tipOpen = false;
  if(G.over) return;
  clock.resume();
  if(clock.left <= 0) return; // loop will end the game
  scanNext();
};

/* ================= PRESORT ================= */
function sortInit(){
  G.queue = [];
  $('#stage').innerHTML =
    '<div class="sort-top"><div class="streak"></div><div class="gaylord"><div class="item" id="sortItem"></div></div>' +
    '<div class="sort-hint">Drag into a bin or tap the bin</div></div>' +
    '<div class="bins">' + AISLES.map(a => '<button class="bin'+(a==='Food'?' food':'')+(AISLE_SUB[a]?' parts':'')+'" data-a="'+esc(a)+'"><span>'+esc(a)+(AISLE_SUB[a]?'<small>'+esc(AISLE_SUB[a])+'</small>':'')+'</span></button>').join('') + '</div>';
  document.querySelectorAll('.bin').forEach(b => b.addEventListener('click', () => sortDrop(b.dataset.a)));
  const it = $('#sortItem');
  it.addEventListener('pointerdown', sortDragStart);
  sortNext();
}
function sortNext(){
  if(!G.queue.length){ G.queue = shuffle(SORT_ITEMS); if(G.item && G.queue[G.queue.length-1] === G.item) G.queue.unshift(G.queue.pop()); }
  const it = G.item = G.queue.pop();
  $('#sortItem').innerHTML = '<span class="ie">'+it.e+'</span><span class="iname">'+esc(it.n)+'</span>';
  setStreak();
}
function binEl(a){ return [...document.querySelectorAll('.bin')].find(b => b.dataset.a === a); }
function sortDrop(a){
  if(G.over || G.lock) return;
  const it = G.item, el = binEl(a);
  if(a === it.a){
    G.right++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    addScore(100 + Math.min(G.streak - 1, 10) * 10);
    el.classList.add('good'); setTimeout(() => el.classList.remove('good'), 250);
    sortNext();
  } else {
    G.wrong++; G.streak = 0; G.missed.push(it);
    addScore(-50); buzz(80);
    el.classList.add('bad');
    const right = binEl(it.a); right.classList.add('hint');
    toast(it.n + ' goes in ' + it.a);
    G.lock = true;
    setTimeout(() => { el.classList.remove('bad'); right.classList.remove('hint'); if(!G || G.over) return; G.lock = false; sortNext(); }, 1000);
  }
}
let drag = null;
function sortDragStart(e){
  if(G.over || G.lock) return;
  e.preventDefault();
  const src = e.currentTarget;
  src.setPointerCapture(e.pointerId);
  drag = {x0:e.clientX, y0:e.clientY, ghost:null, src};
  const move = ev => {
    if(!drag) return;
    const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
    if(!drag.ghost && Math.hypot(dx, dy) > 8){
      drag.ghost = src.cloneNode(true); drag.ghost.removeAttribute('id'); drag.ghost.classList.add('drag');
      document.body.appendChild(drag.ghost); src.style.visibility = 'hidden';
    }
    if(drag.ghost){ drag.ghost.style.left = ev.clientX + 'px'; drag.ghost.style.top = ev.clientY + 'px';
      document.querySelectorAll('.bin').forEach(b => b.style.outline = '');
      const over = document.elementFromPoint(ev.clientX, ev.clientY); const b = over && over.closest('.bin');
      if(b) b.style.outline = '4px solid var(--p)';
    }
  };
  const up = ev => {
    src.removeEventListener('pointermove', move); src.removeEventListener('pointerup', up); src.removeEventListener('pointercancel', up);
    if(!drag) return;
    const had = drag.ghost; if(had) had.remove(); src.style.visibility = '';
    document.querySelectorAll('.bin').forEach(b => b.style.outline = '');
    drag = null;
    if(had){ const over = document.elementFromPoint(ev.clientX, ev.clientY); const b = over && over.closest('.bin'); if(b) sortDrop(b.dataset.a); }
  };
  src.addEventListener('pointermove', move); src.addEventListener('pointerup', up); src.addEventListener('pointercancel', up);
}

                 2:{label:"MED", lb:"20 lb", fill:"#d2a160", edge:"#9c6d33", text:"#4a3010"},
                 3:{label:"HEAVY", lb:"50 lb", fill:"#8c5a2b", edge:"#5b3815", text:"#fff3df"}};
const SHAPES = [[1,1],[2,1],[2,1],[3,1],[4,1],[2,2],[2,2],[3,2],[1,2],[2,3],[4,2],[1,3],[3,1],[2,1]];
let S = null, cv = null, cx = null;

function newBox(){ const s = pick(SHAPES); return {w:s[0], h:s[1], wt:pick([1,1,2,2,3,3])}; }
function stackInit(){
  S = {grid:[...Array(SH)].map(() => Array(SW).fill(0)), heights:Array(SW).fill(0), boxes:{}, nid:1,
       cur:newBox(), next:newBox(), x:0, anim:null, layers:new Set(),
       placed:0, gaps:0, crushes:0, tips:0, layerCount:0, flash:null};
  S.x = Math.floor((SW - S.cur.w)/2);
  $('#stage').innerHTML =
    '<div class="stack-top"><div class="next">NEXT<canvas id="nextC" width="80" height="60"></canvas></div><div id="stackMsg">Line it up</div></div>' +
    '<div class="stackwrap"><canvas id="stackC"></canvas></div>' +
    '<div class="controls"><button id="bL" aria-label="Left">◀</button><button id="bRot" aria-label="Rotate">⟳</button><button id="bR" aria-label="Right">▶</button><button id="bD" class="drop">DROP</button></div>';
  cv = $('#stackC'); cx = cv.getContext('2d');
  $('#bL').onclick = () => stackMove(-1);
  $('#bR').onclick = () => stackMove(1);
  $('#bRot').onclick = stackRotate;
  $('#bD').onclick = stackDrop;
  cv.addEventListener('pointerdown', stackPointer);
  cv.addEventListener('pointermove', e => { if(e.buttons || e.pointerType === 'touch') stackPointer(e); });
  window.addEventListener('resize', stackResize);
  document.addEventListener('keydown', stackKeys);
  stackResize();
  drawNext();
}
function stackKeys(e){
  if(!G || G.over || G.mode !== 'stack') return;
  if(e.key === 'ArrowLeft') stackMove(-1);
  else if(e.key === 'ArrowRight') stackMove(1);
  else if(e.key === 'ArrowUp' || e.key === 'r') stackRotate();
  else if(e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown'){ e.preventDefault(); stackDrop(); }
}
function stackResize(){
  if(!cv) return;
  const wrap = cv.parentElement, dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  S.cell = Math.max(12, Math.floor(Math.min(W / (SW + 0.6), H / (SH + HOVER + 0.8))));
  S.ox = Math.round(0.3 * S.cell);
  const cw = Math.round((SW + 0.6) * S.cell), ch = Math.round((SH + HOVER + 0.8) * S.cell);
  cv.width = cw * dpr; cv.height = ch * dpr; cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S.ch = ch;
}
function rowY(r){ return S.ch - 0.8 * S.cell - (r + 1) * S.cell; }   // top y of row r (row 0 = on pallet)
function colX(c){ return S.ox + c * S.cell; }

function stackMove(d){ if(S.anim || G.over) return; S.x = Math.max(0, Math.min(SW - S.cur.w, S.x + d)); }
function stackRotate(){
  if(S.anim || G.over) return;
  const b = S.cur; [b.w, b.h] = [b.h, b.w];
  S.x = Math.max(0, Math.min(SW - b.w, S.x));
}
function stackPointer(e){
  if(S.anim || G.over) return;
  const r = cv.getBoundingClientRect();
  const col = Math.floor((e.clientX - r.left - S.ox) / S.cell - S.cur.w / 2 + 0.5);
  S.x = Math.max(0, Math.min(SW - S.cur.w, col));
}

// Where would box b land at column x, and what happens?
function landing(b, x){
  let rest = 0;
  for(let c = x; c < x + b.w; c++) rest = Math.max(rest, S.heights[c]);
  let voids = 0, sup = [];
  for(let c = x; c < x + b.w; c++){ voids += rest - S.heights[c]; if(rest === 0 || S.heights[c] === rest) sup.push(c); }
  const over = rest + b.h > SH;
  // stability: center of the box must be over the supported span (edges count)
  let tips = false;
  if(rest > 0){
    const lo = Math.min(...sup), hi = Math.max(...sup) + 1, center = x + b.w / 2;
    tips = center < lo || center > hi;
  }
  const crush = new Set();
  if(rest > 0 && !tips){
    for(const c of sup){ const id = S.grid[rest - 1][c]; if(id && S.boxes[id].wt < b.wt) crush.add(id); }
  }
  return {rest, voids, over, tips, crush:[...crush]};
}
function status(L){
  if(L.over) return ['bad', 'Too tall for the rack'];
  if(L.tips) return ['bad', 'Will tip! Center it over support'];
  if(L.crush.length) return ['warn', 'Crushes a lighter box'];
  if(L.voids) return ['warn', 'Leaves ' + L.voids + ' gap' + (L.voids > 1 ? 's' : '')];
  return ['ok', 'Clean fit ✓'];
}
function canFitAny(b){
  for(const [w, h] of [[b.w, b.h], [b.h, b.w]]){
    for(let x = 0; x + w <= SW; x++){
      let rest = 0; for(let c = x; c < x + w; c++) rest = Math.max(rest, S.heights[c]);
      if(rest + h <= SH) return true;
    }
  }
  return false;
}
function stackDrop(){
  if(S.anim || G.over) return;
  const b = S.cur, L = landing(b, S.x);
  if(L.over){ toast('Too tall. Try another spot or rotate.'); buzz(60); return; }
  S.anim = {b, x:S.x, L, y0:SH + 0.4, t0:performance.now(), dur:160 + 25 * (SH - L.rest)};
}
function finishDrop(){
  const {b, x, L} = S.anim; S.anim = null;
  if(L.tips){
    S.tips++; G.wrong++; G.streak = 0; addScore(-100, 'tipped'); buzz(120);
    S.flash = {x, r:L.rest, w:b.w, h:b.h, t:performance.now(), color:'rgba(210,63,63,'};
    toast('Tipped! A box needs its center over something solid.');
  } else {
    const id = S.nid++; S.boxes[id] = {...b, x, r:L.rest};
    for(let r = L.rest; r < L.rest + b.h; r++) for(let c = x; c < x + b.w; c++) S.grid[r][c] = id;
    for(let c = x; c < x + b.w; c++) S.heights[c] = L.rest + b.h;
    S.placed++;
    let pts = b.w * b.h * 10;
    if(L.voids){ S.gaps += L.voids; pts -= 15 * L.voids; }
    if(L.crush.length){ S.crushes += L.crush.length; pts -= 40 * L.crush.length; L.crush.forEach(cid => S.boxes[cid].crushed = true); toast('Crushed! Heavy goes under light.'); buzz(80); }
    if(!L.voids && !L.crush.length){ pts += 20; G.streak++; G.right++; G.bestStreak = Math.max(G.bestStreak, G.streak); }
    else { G.streak = 0; G.wrong++; }
    let newLayers = 0;
    for(let r = L.rest; r < L.rest + b.h; r++){
      if(!S.layers.has(r) && S.grid[r].every(v => v)){ S.layers.add(r); newLayers++; }
    }
    if(newLayers){ S.layerCount += newLayers; pts += 150 * newLayers; S.flash = {x:0, r:L.rest, w:SW, h:b.h, t:performance.now(), color:'rgba(27,154,82,'}; }
    addScore(pts, newLayers ? 'full layer!' : '');
  }
  S.cur = S.next; S.next = newBox();
  S.x = Math.max(0, Math.min(SW - S.cur.w, S.x));
  drawNext();
  if(!canFitAny(S.cur)) endGame('Pallet full!');
}
function roundRect(x, y, w, h, r){ cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
function drawBox(ctx, px, py, w, h, cell, wt, alpha, crushed){
  const s = WEIGHTS[wt], pad = Math.max(1, cell * 0.04);
  ctx.globalAlpha = alpha;
  const X = px + pad, Y = py + pad, W = w * cell - 2 * pad, H = h * cell - 2 * pad;
  const r = Math.min(6, cell * 0.12);
  ctx.beginPath(); ctx.moveTo(X + r, Y); ctx.arcTo(X + W, Y, X + W, Y + H, r); ctx.arcTo(X + W, Y + H, X, Y + H, r); ctx.arcTo(X, Y + H, X, Y, r); ctx.arcTo(X, Y, X + W, Y, r); ctx.closePath();
  ctx.fillStyle = s.fill; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = s.edge; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(X + W / 2 - cell * 0.12, Y, cell * 0.24, H);   // tape
  if(crushed){ ctx.strokeStyle = 'rgba(210,63,63,.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(X + 4, Y + H * 0.3); ctx.lineTo(X + W * 0.4, Y + H * 0.55); ctx.lineTo(X + W * 0.6, Y + H * 0.3); ctx.lineTo(X + W - 4, Y + H * 0.6); ctx.stroke(); }
  ctx.fillStyle = s.text; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fs = Math.max(8, Math.min(cell * 0.3, (W - 6) / 4));
  ctx.font = '800 ' + fs + 'px system-ui,sans-serif';
  if(H > fs * 2.4){ ctx.fillText(s.label, X + W / 2, Y + H / 2 - fs * 0.6); ctx.font = '600 ' + fs * 0.9 + 'px system-ui,sans-serif'; ctx.fillText(s.lb, X + W / 2, Y + H / 2 + fs * 0.6); }
  else ctx.fillText(w >= 2 ? s.label : s.label[0], X + W / 2, Y + H / 2);
  ctx.globalAlpha = 1;
}
function drawNext(){
  const c = $('#nextC'); if(!c) return;
  const g = c.getContext('2d'); g.clearRect(0, 0, 80, 60);
  const b = S.next, cell = Math.min(70 / b.w, 50 / b.h, 18);
  drawBox(g, (80 - b.w * cell) / 2, (60 - b.h * cell) / 2, b.w, b.h, cell, b.wt, 1);
}
function stackFrame(){
  if(!S || !cv) return;
  const c = S.cell, now = performance.now();
  if(S.anim && now - S.anim.t0 >= S.anim.dur) finishDrop();
  if(G.over) return;
  cx.clearRect(0, 0, cv.width, cv.height);
  // floor
  cx.fillStyle = '#d9d4e0'; cx.fillRect(0, S.ch - 0.8 * c + 0.45 * c, cv.width, c);
  // pallet
  const py = S.ch - 0.8 * c;
  cx.fillStyle = '#b07a3e'; cx.fillRect(colX(0) - 4, py, SW * c + 8, 0.16 * c);
  cx.fillStyle = '#8f5f2c';
  for(let i = 0; i < 3; i++){ const bx = colX(0) - 4 + i * (SW * c + 8 - 0.7 * c) / 2; cx.fillRect(bx, py + 0.16 * c, 0.7 * c, 0.26 * c); }
  cx.fillStyle = '#b07a3e'; cx.fillRect(colX(0) - 4, py + 0.42 * c, SW * c + 8, 0.12 * c);
  // grid guide
  cx.strokeStyle = 'rgba(82,35,152,.07)'; cx.lineWidth = 1;
  for(let i = 0; i <= SW; i++){ cx.beginPath(); cx.moveTo(colX(i), rowY(SH - 1)); cx.lineTo(colX(i), py); cx.stroke(); }
  // max height line
  const my = rowY(SH - 1);
  cx.setLineDash([6, 6]); cx.strokeStyle = 'rgba(210,63,63,.7)'; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(0, my); cx.lineTo(cv.width, my); cx.stroke(); cx.setLineDash([]);
  cx.fillStyle = 'rgba(210,63,63,.8)'; cx.font = '700 ' + Math.max(10, c * 0.28) + 'px system-ui'; cx.textAlign = 'right'; cx.textBaseline = 'bottom';
  cx.fillText('MAX HEIGHT', cv.width / (window.devicePixelRatio || 1) - 4, my - 2);
  // placed boxes
  for(const id in S.boxes){ const b = S.boxes[id]; drawBox(cx, colX(b.x), rowY(b.r + b.h - 1), b.w, b.h, c, b.wt, 1, b.crushed); }
  // flash
  if(S.flash){ const f = S.flash, a = 1 - (now - f.t) / 600; if(a <= 0) S.flash = null; else { cx.fillStyle = f.color + (a * 0.5) + ')'; cx.fillRect(colX(f.x), rowY(f.r + f.h - 1), f.w * c, f.h * c); } }
  if(S.anim){
    const {b, x, L, y0, t0, dur} = S.anim, t = Math.min(1, (now - t0) / dur);
    const r = y0 + (L.rest - y0) * t * t;
    drawBox(cx, colX(x), rowY(r + b.h - 1), b.w, b.h, c, b.wt, 1);
    return;
  }
  // ghost landing + status
  const b = S.cur, L = landing(b, S.x), [cls, msg] = status(L);
  const col = cls === 'ok' ? '27,154,82' : cls === 'warn' ? '217,154,0' : '210,63,63';
  if(!L.over){
    cx.fillStyle = 'rgba(' + col + ',.16)'; cx.fillRect(colX(S.x), rowY(L.rest + b.h - 1), b.w * c, b.h * c);
    cx.setLineDash([5, 4]); cx.strokeStyle = 'rgba(' + col + ',.95)'; cx.lineWidth = 2;
    cx.strokeRect(colX(S.x) + 1, rowY(L.rest + b.h - 1) + 1, b.w * c - 2, b.h * c - 2); cx.setLineDash([]);
    if(L.voids){ cx.fillStyle = 'rgba(217,154,0,.35)';
      for(let cc = S.x; cc < S.x + b.w; cc++) for(let r = S.heights[cc]; r < L.rest; r++) cx.fillRect(colX(cc) + 3, rowY(r) + 3, c - 6, c - 6); }
  }
  // hovering box
  drawBox(cx, colX(S.x), rowY(SH + 0.4 + b.h - 1), b.w, b.h, c, b.wt, 1);
  const m = $('#stackMsg'); if(m && (m.textContent !== msg || !m.classList.contains(cls))){ m.textContent = msg; m.className = cls; }
}
function stackFinalStats(){
  const top = Math.max(...S.heights);
  let filled = 0; for(let r = 0; r < SH; r++) for(let c = 0; c < SW; c++) if(S.grid[r][c]) filled++;
  const neat = top ? filled / (top * SW) : 0;
  return {neat, bonus: Math.round(neat * 300 * Math.min(1, S.placed / 8))};
}

/* ================= END ================= */
function endGame(reason){
  if(!G || G.over) return;
  G.over = true; clock.running = false;
  $('#tip').classList.remove('show'); G.tipOpen = false;
  const m = G.mode;
  let stats = [];
  if(m === 'stack'){
    const f = stackFinalStats();
    if(f.bonus) setScore(G.score + f.bonus);
    stats = [['Boxes placed', S.placed], ['Neatness', Math.round(f.neat * 100) + '%'], ['Full layers', S.layerCount],
             ['Gaps / crushed / tipped', S.gaps + ' / ' + S.crushes + ' / ' + S.tips]];
  } else {
    const tot = G.right + G.wrong;
    stats = [['Correct', G.right + ' / ' + tot], ['Accuracy', tot ? Math.round(100 * G.right / tot) + '%' : '0%'],
             ['Best streak', G.bestStreak], ['Ended', reason.replace('!', '')]];
  }
  const key = 'cs_best_' + m, prev = store.get(key, 0), isBest = G.score > prev;
  if(isBest) store.set(key, G.score);
  cleanupStage();
  const nm = (nameIn.value || '').trim();
  $('#endWho').textContent = nm || 'Volunteer';
  $('#endMode').textContent = MODES[m].name + ' · ' + reason;
  $('#endScore').textContent = G.score;
  $('#endBadge').innerHTML = isBest && G.score > 0 ? '<span class="badge">★ NEW PERSONAL BEST</span>' : '<span class="stamp">Your best: ' + Math.max(prev, G.score) + '</span>';
  $('#endStats').innerHTML = stats.map(s => '<div><small>' + s[0] + '</small><b>' + esc(s[1]) + '</b></div>').join('');
  let recap = '';
  if(m === 'scan' && G.missed.length){
    const rules = [...new Set(G.missed.map(q => q.rule))].sort();
    recap = '<div class="recap"><h4>Rules to brush up on</h4><ul>' + rules.map(r => '<li><b>Rule ' + r + ': ' + RULES[r][0] + '.</b> ' + esc(RULES[r][1]) + '</li>').join('') + '</ul></div>';
  }
  if(m === 'sort' && G.missed.length){
    const seen = new Map(); G.missed.forEach(it => seen.set(it.n, it.a));
    recap = '<div class="recap"><h4>Missed sorts</h4><ul>' + [...seen].slice(0, 8).map(([n, a]) => '<li>' + esc(n) + ' → <b>' + esc(a) + '</b></li>').join('') + '</ul></div>';
  }
  $('#endRecap').innerHTML = recap;
  setTimeout(() => show('end'), m === 'stack' ? 500 : 150);
}
</script>
</body>
</html>
